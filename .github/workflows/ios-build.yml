name: iOS Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS Simulator
        run: xcodebuild -project Biome/Biome.xcodeproj -scheme Biome -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build

